[project]
name = "real-world-openenv-environment"
version = "0.1.0"
description = "OpenEnv-based AI environment with multiple tasks, graders, and inference pipeline"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
